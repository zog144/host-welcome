name: host-welcome checks

on:
  push:
    branches: [main, unstable]
  pull_request:

permissions:
  contents: read

jobs:
  stdlib-tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package
        run: python -m pip install -e .
      - name: Unit tests
        run: python -m unittest discover -s tests -v
      - name: Render headless and browser examples
        run: |
          python -m host_welcome --scenario pending
          python -m host_welcome --scenario recovery --format html --output /tmp/host-welcome-recovery.html
          python -m host_welcome --scenario ready --format json
