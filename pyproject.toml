[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "zog-host-welcome"
version = "0.1.0"
description = "Simulation-first, read-only Zog host welcome presentations"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
host-welcome = "host_welcome.cli:main"\nhost-welcome-kiosk = "host_welcome.kiosk:main"\nhost-welcome-previews = "host_welcome.previews:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
host_welcome = ["assets/*.svg", "assets/*.js", "examples/*.json"]
